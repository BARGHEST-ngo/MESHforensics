services:
  analyst:
    build:
      context: .
      dockerfile: analyst/Dockerfile
    # NET_RAW lets tcpdump capture forwarded device traffic.
    # Bridged networking keeps the analyst in its own network namespace.
    cap_add:
      - NET_RAW
    volumes:
      # Default outside the repo tree: acquisitions hold pulled APKs and a
      # device backup and must not land in the working copy. Override with
      # ACQUISITION_DIR in .env to point at a dedicated evidence store.
      - ${ACQUISITION_DIR:-${HOME}/mesh-acquisitions}:/home/mesh/acquisitions:z
    stdin_open: true
    tty: true
