version: '3'
silent: true
tasks:
  build:
    desc: Build MESHforensics Docker containers
    cmds:
      - docker compose build

  down:
    desc: Stop MESHforensics Docker containers
    cmds:
      - |
        docker compose down
        printf "\033[1;32mMESHforensics analyst stopped.\033[0m\n"

  analyst:
    desc: Start the MESHforensics analyst CLI
    cmds:
      - docker compose run --rm --build --name mesh-analyst analyst

  shell:
    desc: Open a shell in the running analyst e.g. for tcpdump
    cmds:
      - docker exec -it --user mesh mesh-analyst bash
